</style></head><body><header><div><strong><span class="gc-logo">GC</span><span class="mix-logo">MIX.</span></strong><br><small id="today"></small></div><div class="row"><button onclick="backup()">백업 저장</button><button onclick="document.getElementById('restore').click()">백업 불러오기</button><input id="restore" type="file" accept=".json" hidden><label>테마 <input type="color" id="theme" value="#d62b78" style="padding:0;width:32px;height:28px"></label></div></header><main><section class="hero"><small>GLOBAL CONTENT MARKETING MANAGEMENT</small><h1><span class="gc-logo">GC</span><span class="mix-logo">MIX.</span></h1><div class="brand-tagline" id="brandTagline">CREATE · DISTRIBUTE · EXPAND</div><div>발견 → 기획 → 제작 → 현지화 → 배포 → 검색 자산 → 성과 분석</div><p>모든 언어를 모든 플랫폼에 반복 게시하지 않고, 플랫폼마다 주력 언어를 정해 운영합니다.</p></section><div class="row" style="margin-bottom:14px"><button class="primary" onclick="tab='글로벌 제목 번역';render()">GLOBAL TITLE LAB · 6개 시장 제목 번역 →</button></div><div id="overview" class="grid"></div><nav class="tabs" id="tabs"></nav><div id="content"></div><section id="productionGuide" class="guide"></section><section id="designPanel" class="guide"></section></main><script>
const stages=[['01','소재 발굴 · 리서치',['오늘의 카테고리 및 주제 확정','타깃 국가와 콘텐츠 목적 선정','검색어·현지 관심사 조사','신뢰 가능한 출처 2개 이상 확보 및 기록','촬영 장소·가격·영업정보 등 사실 확인 (해당 시)','이미지·음악·영상 사용권 확인']],['02','기획 · 원본 제작',['핵심 메시지와 도입 3초 기획','한국어 원본 대본 작성','스토리보드 및 촬영 리스트 작성','촬영 또는 사용 허가 소스 확보','AE/PR 원본 편집 (세로 1080×1920)','자막·음성·텍스트 레이어 분리','워터마크 없는 클린 원본 출력','썸네일 및 제목 초안 작성']],['03','다국어 현지화',['영어 제목·자막·설명·해시태그','간체 중국어 제목·자막·설명·해시태그','일본어 제목·자막·설명·해시태그','번체 중국어 제목·자막·설명·해시태그','한국어 제목·자막·설명·해시태그','현지 관점·가격 단위·고유명사 검토','번역 품질 및 화면 글자 잘림 검수']],['04','콘텐츠 재가공',['15~60초 숏폼 완성','카드뉴스 5~9장 제작','Pinterest용 2:3 검색 이미지 제작','검색형 상세 글 초안 작성','Threads/X용 질문 또는 짧은 글 작성','필요 시 롱폼 또는 추가 설명 제작']],['05','플랫폼 배포',['YouTube: 원본 1회 게시 + 다국어 제목·설명·자막','Instagram: 영어 중심 릴스 게시','TikTok: 영어 중심 숏폼 게시','Pinterest: 영어 이미지 및 링크 게시','샤오홍슈: 간체 중국어 게시','빌리빌리: 간체 중국어 영상 게시','웨이보: 간체 중국어 요약 게시','Lemon8: 일본어 카드뉴스/영상 게시','X: 일본어 요약 및 소통','note: 일본어 검색형 글 게시','Threads: 번체 중국어 중심 게시','Facebook: 번체 중국어 지역 그룹 규정 확인 후 게시','네이버 블로그: 한국어 글 게시','네이버 클립: 한국어 숏폼 게시','게시 링크 기록 및 중복·광고 정책 확인']],['06','검색 자산 · 웹사이트',['WordPress 원본 상세 글 게시','영어 /en/ 페이지 작성','간체 /zh-cn/ 페이지 작성','번체 /zh-tw/ 페이지 작성','일본어 /ja/ 페이지 작성','한국어 /ko/ 페이지 작성','언어별 URL·hreflang·canonical 검토','검색 제목·메타 설명·이미지 ALT 작성','관련 글 내부 링크 및 출처 연결','사이트맵·검색 색인·모바일 화면 확인']],['07','분석 · 수익화',['24시간 조회·저장·공유·댓글 기록','7일 후 플랫폼별 성과 기록','유입 국가·클릭·웹사이트 방문 비교','댓글에서 다음 콘텐츠 소재 수집','성과 좋은 주제의 후속편 기획','협찬·제휴·광고·서비스·상품 판매 가능성 검토','실제 판매 전 인증·배송·수입 및 광고 규정 확인']]];

const initial=()=>({projects:[{id:Date.now().toString(),name:'2027 봄여름 컬러 트렌드',cat:'COLOR',date:new Date().toISOString().slice(0,10),checks:{},notes:{},links:'',stats:'',extra:[]}],selected:null,setup:{},weeks:{},accounts:{},theme:'#d62b78'});let s;try{s=JSON.parse(localStorage.getItem('globalStudioV1'))||initial()}catch{s=initial()}if(!s.selected)s.selected=s.projects[0]?.id;let tab='배포 일정';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('globalStudioV1',JSON.stringify(s))}catch(e){alert('브라우저 저장이 제한되어 있습니다. 백업을 저장하세요.')}}function p(){return s.projects.find(x=>x.id===s.selected)}function tasks(pr){return stages.flatMap((st,i)=>st[2].map((t,j)=>({k:i+'-'+j,t,stage:st[1]}))).concat((pr.extra||[]).map((t,i)=>({k:'x-'+i,t,stage:'추가 작업'})))}function counts(pr){let a=tasks(pr);return [a.filter(t=>pr.checks[t.k]==='done').length,a.filter(t=>pr.checks[t.k]==='skip').length,a.length]}function status(k){let pr=p();let v=pr.checks[k];pr.checks[k]=v==='done'?'': 'done';save();render()}function skip(k){let pr=p();pr.checks[k]=pr.checks[k]==='skip'?'':'skip';save();render()}function generic(group,k){s[group][k]=!s[group][k];save();render()}function note(k,v){p().notes[k]=v;save()}function progress(d,n){return `<div class="bar"><i style="width:${n?100*d/n:0}%"></i></div>`}function checklist(a,group,prefix=''){return a.map((t,i)=>{let k=prefix+i;return `<div class="task ${s[group][k]?'done':''}"><button onclick="generic('${group}','${k}')">${s[group][k]?'✓ 완료':'완료'}</button><span>${esc(t)}</span></div>`}).join('')}function render(){document.documentElement.style.setProperty('--pink',s.theme);$('theme').value=s.theme;let pr=p(),all=s.projects.reduce((a,x)=>{let c=counts(x);return [a[0]+c[0],a[1]+c[1],a[2]+c[2]]},[0,0,0]);$('overview').innerHTML=`<div class="card"><small>전체 프로젝트</small><div class="metric">${s.projects.length}</div></div><div h+=`<div class="card"><h2>날짜별 업로드 일정</h2><div class="row">${[['all','전체'],['today','오늘·밀린 일정'],['pending','미완료'],['done','완료']].map(x=>`<button class="${filter===x[0]?'active':''}" onclick="s.scheduleFilter='${x[0]}';save();render()">${x[1]}</button>`).join('')}</div><div class="scroll"><table><tr><th>예정일</th><th>플랫폼 / 콘텐츠</th><th>상태 및 조정</th><th>게시 기록</th></tr>${visible.map(x=>`<tr><td><input type="date" value="${x.date}" onchange="scheduleChange('${x.id}','date',this.value)"><br><small>${x.done?'완료':x.skip?'제외':x.date<today?'밀림':x.date===today?'오늘':'예정'}</small></td><td><a href="${urls[x.platform]}" target="_blank" rel="noopener"><b>${x.platform}</b></a><br>${flow[x.i][1]} · ${flow[x.i][0]} · ${flow[x.i][2]}<br><small>${a.made[x.i]?'제작 완료':'제작 미완료'}</small></td><td><button ${x.skip?'disabled':''} onclick="scheduleChange('${x.id}','done',${!x.done})">${x.done?'✓ 업로드 완료':'업로드 완수'}</button> <button ${x.done?'disabled':''} onclick="scheduleChange('${x.id}','skip',${!x.skip})">${x.skip?'제외 취소':'제외'}</button><br><button ${x.done?'disabled':''} onclick="scheduleChange('${x.id}','date',plusDay('${x.date}',1))">+1일</button> <button ${x.done?'disabled':''} onclick="scheduleChange('${x.id}','date',plusDay('${x.date}',2))">+2일</button></td><td><input placeholder="게시 URL" value="${esc(x.link)}" onchange="scheduleChange('${x.id}','link',this.value)"><br><small>${x.actual?'실제 게시일: '+x.actual:''}</small></td></tr>`).join('')}</table></div><p class="muted">이 도구는 일정과 수동 완료 기록을 관리합니다. 실제 자동 게시 기능은 없습니다. 1~2일 간격은 운영 편의를 위한 기준이며 중복 콘텐츠 정책을 보장하지 않습니다. 더우인은 인증 가능 시 진행하세요.</p></div>`;return h}

function applyDesign(){let d={...designDefaults,pink:s.theme||designDefaults.pink,...s.design};for(let k of ['pink','bg','ink','muted','line','card','hero','video','image','search','social'])document.documentElement.style.setProperty('--'+k,d[k]);for(let k of ['body','heading'])document.documentElement.style.setProperty('--'+k+'-font',d[k+'Font']);for(let k of ['title','section','body'])document.documentElement.style.setProperty('--'+k+'-size',d[k+'Size']+'px');function logo(el,value){if(value==='GCMIX.')el.innerHTML='<span class="gc-logo">GC</span><span class="mix-logo">MIX.</span>';else el.textContent=value}logo(document.querySelector('header strong'),d.brand);logo(document.querySelector('.hero h1'),d.title);document.querySelector('.hero small').textContent=d.subtitle;$('brandTagline').textContent=d.tagline;document.title=d.brand;$('theme').value=d.pink;}
function changeDesign(k,v){s.design={...s.design,[k]:v};if(k==='pink')s.theme=v;save();applyDesign()}
function renderDesign(){let d={...designDefaults,pink:s.theme||designDefaults.pink,...s.design};let colors=[['pink','강조색 / 버튼'],['bg','전체 배경'],['card','카드 배경'],['hero','상단 배너'],['ink','본문 글자'],['muted','보조 글자'],['line','테두리'],['video','영상형'],['image','이미지형'],['search','검색형'],['social','소통형']];let fonts=[['system-ui','시스템 기본'],['Malgun Gothic','맑은 고딕'],['Arial','Arial'],['Georgia','Georgia'],['serif','명조 계열'],['monospace','고정폭']];$('designPanel').innerHTML=`<div class="card"><small>PERSONALIZE YOUR STUDIO</small><h2>내 작업실 디자인 설정</h2><p>변경 즉시 적용되며 자동 저장됩니다. 설치된 글꼴을 사용합니다.</p><div class="settings-grid">${[['brand','사이트 이름'],['title','메인 제목'],['subtitle','상단 작은 제목'],['tagline','하단 슬로건']].map(([k,n])=>`<label>${n}<input value="${esc(d[k])}" oninput="changeDesign('${k}',this.value)"></label>`).join('')}</div><h3 style="margin-top:22px">테마 컬러</h3><div class="row"><button onclick="preset('pink')">Pop Pink</button><button onclick="preset('blue')">Soft Blue</button><button onclick="preset('dark')">Dark</button><button onclick="preset('cream')">Cream</button></div><div class="settings-grid" style="margin-top:12px">${colors.map(([k,n])=>`<label>${n}<input type="color" value="${esc(d[k])}" oninput="changeDesign('${k}',this.value)"></label>`).join('')}</div><h3 style="margin-top:22px">글꼴 및 글자 크기</h3><div class="settings-grid">${[['bodyFont','본문 글꼴'],['headingFont','제목 글꼴']].map(([k,n])=>`<label>${n}<select onchange="changeDesign('${k}',this.value)">${fonts.map(([v,l])=>`<option value="${v}" ${v===d[k]?'selected':''}>${l}</option>`).join('')}</select></label>`).join('')}${[['titleSize','메인 제목 크기',24,72],['sectionSize','섹션 제목 크기',16,36],['bodySize','본문 크기',12,22]].map(([k,n,a,b])=>`<label>${n} <output>${d[k]}px</output><input type="range" min="${a}" max="${b}" value="${d[k]}" oninput="this.previousElementSibling.value=this.value+'px';changeDesign('${k}',Number(this.value))"></label>`).join('')}</div><div class="row" style="margin-top:20px"><button onclick="if(confirm('디자인만 기본값으로 되돌릴까요?')){s.design={};s.theme=designDefaults.pink;save();applyDesign();renderDesign()}">디자인 초기화</button><small>프로젝트 및 완료 기록은 유지됩니다.</small></div></div>`}
function preset(n){let a={pink:{pink:'#d62b78',bg:'#fff5f9',card:'#ffffff',hero:'#fce1ee',ink:'#302332',muted:'#856d7e',line:'#efdae5'},blue:{pink:'#3979ae',bg:'#eef5fb',card:'#ffffff',hero:'#d9eaf7',ink:'#20364a',muted:'#516a80',line:'#cddfea'},dark:{pink:'#ed90bf',bg:'#181820',card:'#252530',hero:'#392b41',ink:'#f7edf6',muted:'#c0adbd',line:'#4a4050'},cream:{pink:'#9c6444',bg:'#f8f3e8',card:'#fffdf8',hero:'#efdfc8',ink:'#40352c',muted:'#786959',line:'#e3d5c0'}}[n];s.design={...s.design,...a};s.theme=a.pink;save();applyDesign();renderDesign()}
if(s.design){if(s.design.title==='하나의 원본, 세계로.')s.design.title=designDefaults.title;if(s.design.subtitle==='ONE IDEA · MULTIPLE MARKETS')s.design.subtitle=designDefaults.subtitle;}

const markets=[['US','🇺🇸 미국','en-US','YouTube · Instagram · TikTok · Pinterest','Fashion Trends|Runway Analysis|Outfit Ideas|Korean Beauty|K-pop|Korea Travel|Busan Food Guide'],['CN','🇨🇳 중국 간체','zh-CN','小红书 · 抖音 · 哔哩哔哩','时尚趋势|秀场解析|高级感穿搭|韩国美妆|韩流|韩国旅游攻略|釜山美食'],['TC','🌐 중국어 번체','zh-TW','번체권 공통 · YouTube · Instagram','時尚趨勢|時裝秀解析|質感穿搭|韓國美妝|韓流|韓國旅遊|釜山美食'],['JP','🇯🇵 일본','ja-JP','YouTube · Instagram · Lemon8 · X','ファッショントレンド|コレクション解説|大人コーデ|韓国コスメ|K-POP|韓国旅行|釜山グルメ'],['TW','🇹🇼 대만','zh-TW','Instagram · Threads · Dcard','流行趨勢|精品秀場|韓系穿搭|韓系美妝|韓星|韓國自由行|釜山必吃'],['VN','🇻🇳 베트남','vi-VN','TikTok · Facebook · YouTube','Xu hướng thời trang|Phân tích show diễn|Phối đồ|Mỹ phẩm Hàn Quốc|K-pop|Du lịch Hàn Quốc|Ẩm thực Busan']];
const topicOptions=[['fashion','패션·컬렉션',[0,1,2]],['beauty','뷰티·화장품',[3]],['kpop','K-POP',[4]],['travel','한국 여행',[5]],['food','부산 맛집',[6]],['other','기타',[]]];
function loc(pr=p()){return pr.localize||(pr.localize={source:pr.name,from:'ko-KR',topic:pr.cat==='FASHION'||pr.cat==='COLOR'||pr.cat==='STYLE'?'fashion':pr.cat==='TRAVEL'?'travel':pr.cat==='LOCAL BUSAN'?'food':'other',context:'',results:{}})}
function locSet(k,v){loc()[k]=v;save()}
function locResult(id,k,v){let l=loc();l.results[id]??={};l.results[id][k]=v;save()}
function locKeywords(m,l){return (topicOptions.find(t=>t[0]===l.topic)||topicOptions[5])[2].map(i=>m[4].split('|')[i])}
function localizeView(){let pr=p();if(!pr)return '<div class="card">프로젝트를 먼저 추가하세요.</div>';let l=loc(pr);return `<div class="card"><small>GLOBAL TITLE LAB · SEO / AEO</small><div class="row between"><h2>국가별 제목 현지화 작업실</h2><select onchange="s.selected=this.value;save();render()">${s.projects.map(x=>`<option value="${esc(x.id)}" ${x.id===pr.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><p>영국식 영어 내레이션 1개 → 공통 영상 → 현지어 자막 및 제목 6종. 미국식 검색 표현과 현지 독자의 검색 의도를 고려합니다.</p><label>원본 제목<textarea id="locSource" oninput="locSet('source',this.value)">${esc(l.source)}</textarea></label><div class="row"><label>원문 언어 <select onchange="locSet('from',this.value)">${[['ko-KR','한국어'],['en-GB','영어']].map(x=>`<option value="${x[0]}" ${l.from===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><label>주제 <select onchange="locSet('topic',this.value);render()">${topicOptions.map(t=>`<option value="${t[0]}" ${l.topic===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></label></div><label>영상 핵심 내용 · 브랜드 · 지역 · 반드시 유지할 사실<textarea oninput="locSet('context',this.value)" placeholder="예: 셀린느와 디올 2027 봄여름 컬렉션 비교, 영국식 영어 내레이션">${esc(l.context)}</textarea></label><div class="row"><button class="primary" onclick="translateMarkets()">6개 시장 제목 자동 번역</button><button onclick="copyLocPrompt()">AI SEO 현지화 요청 복사</button><a href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT 열기</a></div><p class="muted">자동 번역은 외부 MyMemory 서비스로 원문 제목을 전송합니다(인터넷 필요, 무료 한도 및 접속 제한 가능). 키워드는 주제별 추천 예시이며 실시간 검색량이 아닙니다. AI 요청을 복사해 ChatGPT에서 실행하면 문맥 기반 제목·키워드를 개선할 수 있습니다.</p><div id="locStatus" aria-live="polite"></div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))">${markets.map(m=>{let r=l.results[m[0]]||{},ks=locKeywords(m,l);return `<div class="card"><small>${m[0]} · ${esc(m[3])}</small><h2>${m[1]}</h2><label>현지화 제목<textarea id="title_${m[0]}" oninput="locResult('${m[0]}','title',this.value);document.getElementById('len_${m[0]}').textContent=Array.from(this.value).length+'자'">${esc(r.title||'')}</textarea></label><small id="len_${m[0]}">${Array.from(r.title||'').length}자</small><div class="row"><button onclick="copyText(document.getElementById('title_${m[0]}').value)">제목 복사</button><button onclick="translateMarkets('${m[0]}')">개별 번역</button></div><h3 style="margin-top:14px">추천 검색 키워드</h3><div class="row">${ks.map(k=>`<button onclick="addLocKeyword('${m[0]}',this.textContent)">${esc(k)}</button>`).join('')||'<small>직접 입력하거나 AI 요청으로 생성하세요.</small>'}</div><textarea id="kw_${m[0]}" placeholder="키워드 · 해시태그 (쉼표 구분)" oninput="locResult('${m[0]}','keywords',this.value)">${esc(r.keywords||'')}</textarea><div class="row"><button onclick="copyText(document.getElementById('kw_${m[0]}').value)">키워드 복사</button><button onclick="copyMarket('${m[0]}')">제목 + 키워드 복사</button></div><label class="row"><input type="checkbox" ${r.reviewed?'checked':''} onchange="locResult('${m[0]}','reviewed',this.checked)"> 현지화 검수 완료</label><small>${m[0]==='TC'?'범용 번체 표현':m[0]==='TW'?'대만 현지 어휘를 우선 검토':'현지 검색 의도에 맞게 제목을 검수하세요.'}</small></div>`}).join('')}</div><div class="card"><h2>AI 결과 가져오기</h2><p>AI 요청을 복사해 실행한 후 받은 JSON을 붙여 넣으면 6개 국가별 카드에 반영됩니다.</p><textarea id="locImport" placeholder='{"US":{"title":"...","keywords":"..."}, ...}'></textarea><div class="row"><button class="primary" onclick="importLoc()">AI 결과 적용</button><button onclick="copyAllLoc()">전체 제목 및 키워드 복사</button></div></div>`}
async function copyText(t){if(!t)return;try{await navigator.clipboard.writeText(t)}catch{let el=document.createElement('textarea');el.value=t;document.body.append(el);el.select();let ok=document.execCommand('copy');el.remove();if(!ok)prompt('복사하세요',t)}}
function addLocKeyword(id,k){let el=$('kw_'+id),a=el.value.split(',').map(x=>x.trim()).filter(Boolean);if(!a.includes(k))a.push(k);el.value=a.join(', ');locResult(id,'keywords',el.value)}
function copyMarket(id){let r=loc().results[id]||{};copyText([r.title,r.keywords].filter(Boolean).join('\n'))}
function copyAllLoc(){copyText(markets.map(m=>{let r=loc().results[m[0]]||{};return m[1]+'\n'+(r.title||'')+'\n'+(r.keywords||'')}).join('\n\n'))}
function copyLocPrompt(){let l=loc();copyText(`다음 영상 제목을 6개 시장에 맞게 현지화해줘. 직역하지 말고 현지 검색 의도, 자연스러운 검색 키워드, 플랫폼별 표현을 고려해. 실제 검색량을 확인하지 않았다면 인기 키워드라고 단정하지 마. 원문의 연도, 브랜드, 사실은 유지하고 과장하지 마. 미국은 미국식 영어, 중국은 간체, TC는 범용 번체, 일본은 일본어, TW는 대만 현지 번체 어휘, VN은 베트남어. 제목은 가급적 100자 이내. 키워드 5개를 쉼표로 구분. 결과는 설명 없이 JSON 객체로만 출력: ${JSON.stringify(Object.fromEntries(markets.map(m=>[m[0],{title:'',keywords:''}])))}\n원문: ${l.source}\n주제: ${l.topic}\n영상 내용: ${l.context}\n플랫폼: ${markets.map(m=>m[0]+': '+m[3]).join('; ')}`)}
function importLoc(){try{let raw=$('locImport').value.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let obj=JSON.parse(raw),l=loc(),n=0;for(let m of markets){let v=obj[m[0]];if(v&&typeof v.title==='string'){l.results[m[0]]={title:v.title,keywords:Array.isArray(v.keywords)?v.keywords.join(', '):String(v.keywords||''),reviewed:false};n++}}if(!n)throw Error();save();render();$('locStatus').textContent=n+'개 시장 AI 결과 적용 완료'}catch{alert('JSON 형식을 확인하세요.')}}
let translating=false;
async function translateMarkets(only){if(translating)return;let pr=p(),l=loc(pr),source=l.source.trim();if(!source)return alert('원본 제목을 입력하세요.');if(new TextEncoder().encode(source).length>500)return alert('자동 번역은 원문 500바이트 이하에서 가능합니다.');if(!confirm('외부 번역 서비스에 원문 제목을 전송할까요? 기존 해당 제목은 성공 시 교체됩니다.'))return;translating=true;let list=markets.filter(m=>!only||m[0]===only),errors=[],n=0,cache={};const msg=t=>{if(p()===pr&&$('locStatus'))$('locStatus').textContent=t};try{for(let m of list){msg(m[1]+' 번역 중…');try{let key=m[2],title=cache[key];if(!title){let u=new URL('https://api.mymemory.translated.net/get');u.searchParams.set('q',source);u.searchParams.set('langpair',l.from+'|'+key);let res=await fetch(u,{signal:AbortSignal.timeout(15000)});if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json();if(Number(data.responseStatus)!==200||!data.responseData?.translatedText)throw Error(data.responseDetails||'번역 실패');let doc=new DOMParser().parseFromString(data.responseData.translatedText,'text/html');title=doc.body.textContent;cache[key]=title}let old=l.results[m[0]]||{};l.results[m[0]]={...old,title,keywords:old.keywords||locKeywords(m,l).join(', '),reviewed:false};n++;save();if(p()===pr&&tab==='글로벌 제목 번역')render()}catch(e){errors.push(m[1])}}}finally{translating=false;msg('번역 완료 '+n+'/'+list.length+(errors.length?' · 실패: '+errors.join(', ')+' (AI 요청 복사 또는 재시도)':' · 제목과 키워드를 검수하세요.'))}}

const originalRender=render;render=function(){originalRender();applyDesign();renderDesign()};$('theme').oninput=e=>{changeDesign('pink',e.target.value);renderDesign()};renderGuide();render();
</script></body></html>
